<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-label="SideSpace menu mockup"><title>SideSpace menu mockup</title><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif}.body{font-size:18px;fill:#475569}.small{font-size:14px;fill:#64748b}.title{font-size:32px;font-weight:700;fill:#10213c}.label{font-size:22px;font-weight:600;fill:#10213c}</style>
